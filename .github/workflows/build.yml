name: Build Unsigned iOS IPA & Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Build Unsigned iOS .ipa on macOS
  # ==========================================
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate clean iOS & Android scaffolding
        run: |
          # Backup custom Info.plist and main.dart if they exist
          if [ -f "ios/Runner/Info.plist" ]; then
            cp ios/Runner/Info.plist /tmp/Info.plist.bak
          fi
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/main.dart.bak
          fi

          # Remove incomplete ios/android folders so flutter create builds a fresh Xcode project
          rm -rf ios android

          # Generate complete native project files
          flutter create --org com.custom.ytadfree --project-name adfree_youtube --platforms=ios,android .

          # Ensure flutter_inappwebview is registered in pubspec.yaml and triggers Podfile generation
          flutter pub add flutter_inappwebview

          # Restore your custom main.dart and Info.plist
          if [ -f "/tmp/main.dart.bak" ]; then
            cp /tmp/main.dart.bak lib/main.dart
          fi
          if [ -f "/tmp/Info.plist.bak" ]; then
            cp /tmp/Info.plist.bak ios/Runner/Info.plist
          fi

      - name: Build iOS Release (.app bundle without codesigning)
        run: flutter build ios --release --no-codesign

      - name: Package .app into Unsigned .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r -9 YT-AdFree-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Unsigned-IPA
          path: build/ios/iphoneos/YT-AdFree-Unsigned.ipa

  # ==========================================
  # JOB 2: Build Release Android .apk on Linux
  # ==========================================
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate clean Android scaffolding
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          fi
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/main.dart.bak
          fi

          rm -rf android
          flutter create --org com.custom.ytadfree --project-name adfree_youtube --platforms=android .
          flutter pub add flutter_inappwebview

          if [ -f "/tmp/main.dart.bak" ]; then
            cp /tmp/main.dart.bak lib/main.dart
          fi
          if [ -f "/tmp/AndroidManifest.xml.bak" ]; then
            cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk