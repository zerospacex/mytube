name: Build Unsigned iOS IPA & Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Build Unsigned iOS .ipa on macOS
  # ==========================================
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter Project & Build Unsigned IPA
        run: |
          # 1. Backup your custom Dart code and Info.plist if present
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/main.dart.bak
          fi
          if [ -f "ios/Runner/Info.plist" ]; then
            cp ios/Runner/Info.plist /tmp/Info.plist.bak
          fi

          # 2. Wipe any broken/partial project files and generate a clean Flutter project
          rm -rf ios android pubspec.lock
          flutter create --org com.custom.ytadfree --project-name adfree_youtube --platforms=ios,android .

          # 3. Restore your custom main.dart and Info.plist
          if [ -f "/tmp/main.dart.bak" ]; then
            cp /tmp/main.dart.bak lib/main.dart
          fi
          if [ -f "/tmp/Info.plist.bak" ]; then
            cp /tmp/Info.plist.bak ios/Runner/Info.plist
          fi

          # 4. Add the WebView plugin and resolve packages
          flutter pub add flutter_inappwebview
          flutter pub get

          # 5. Build the unsigned iOS .app bundle (Flutter automatically generates Podfile & runs pod install here)
          flutter build ios --release --no-codesign

          # 6. Package the .app into an installable .ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r -9 YT-AdFree-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Unsigned-IPA
          path: build/ios/iphoneos/YT-AdFree-Unsigned.ipa

  # ==========================================
  # JOB 2: Build Release Android .apk on Linux
  # ==========================================
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter Project & Build APK
        run: |
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/main.dart.bak
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          fi

          rm -rf ios android pubspec.lock
          flutter create --org com.custom.ytadfree --project-name adfree_youtube --platforms=ios,android .

          if [ -f "/tmp/main.dart.bak" ]; then
            cp /tmp/main.dart.bak lib/main.dart
          fi
          if [ -f "/tmp/AndroidManifest.xml.bak" ]; then
            cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          fi

          flutter pub add flutter_inappwebview
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk