name: Build Windows Music App
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - uses: NuGet/setup-nuget@v2
      - name: Analyze and package Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MyTube-Music-Windows-x64
          path: artifacts/MyTube-Music-Windows-x64.zip
          if-no-files-found: error
